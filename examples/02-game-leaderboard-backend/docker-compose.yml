services:
  mongodb:
    image: mongodb/mongodb-community-server:8.2.12-ubuntu2204@sha256:ed7000edd775a8a7d1010618b72b2c71603efe2ca4f827b7f291110a696b4a41
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --port
      - "27019"
      - --nounixsocket
      - --quiet
    ports:
      - "127.0.0.1:27019:27019"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port 27019 --eval
          'try { const status = rs.status(); quit(status.myState === 1 ? 0 : 1); }
          catch (error) { try { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27019"}]}); }
          catch (initError) {} quit(1); }'
      start_period: 5s
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
