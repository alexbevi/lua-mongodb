name: CI Fast

on:
  push:
  pull_request:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua-version: ["5.4.8", "5.5.1"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "${{ matrix.lua-version }}"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Configure OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          openssl_dir="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=$openssl_dir" >> "$GITHUB_ENV"
          echo "CRYPTO_DIR=$openssl_dir" >> "$GITHUB_ENV"

      - name: Install development dependencies
        run: |
          if test -n "${OPENSSL_DIR:-}"; then
            luarocks install --only-deps mongodb-0.6.0-1.rockspec OPENSSL_DIR="$OPENSSL_DIR" CRYPTO_DIR="$CRYPTO_DIR"
          else
            luarocks install --only-deps mongodb-0.6.0-1.rockspec
          fi
          luarocks install busted 2.3.0-1

      - name: Install Lua 5.4 lint tools
        if: matrix.lua-version == '5.4.8'
        run: |
          luarocks install luacheck 1.2.0-1

      - name: Run required fast verification
        if: matrix.lua-version == '5.4.8'
        run: make check-fast

      - name: Run Lua 5.5 runtime verification
        if: matrix.lua-version == '5.5.1'
        run: make check-fast-runtime

      - name: Verify executable roadmap and commit evidence
        run: python3 planning/update_plan.py check --strict

  compatibility-smoke:
    strategy:
      fail-fast: false
      matrix:
        entry: [mongodb-7.0-standalone, mongodb-8.0-sharded, mongodb-8.2-replicaset]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install driver dependencies
        run: luarocks install --only-deps mongodb-0.6.0-1.rockspec

      - name: Run live compatibility boundary row
        run: make test-compatibility-live COMPATIBILITY_ENTRY=${{ matrix.entry }}

      - name: Upload machine-readable environment facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-smoke-${{ matrix.entry }}
          path: build/compatibility/*.json
          if-no-files-found: warn

  examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install example verification tools
        run: luarocks install luacheck 1.2.0-1

      - name: Run installed-rock examples
        env:
          MONGODB_EXAMPLES_LIVE: "1"
        run: >-
          make test-focus
          FOCUS_PYTHON=spec.examples.test_examples
          FOCUS_LINT='examples/00-connect-and-ping/main.lua
          examples/01-luarocks-package-explorer/*.lua
          examples/02-game-leaderboard-backend/*.lua
          examples/03-pong-game-using-changestreams/*.lua
          examples/03-pong-game-using-changestreams/client/*.lua'
