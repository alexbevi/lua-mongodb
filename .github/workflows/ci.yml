name: CI Fast

on:
  push:
  pull_request:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lua-version: "5.4.9"
            verification: full
          - os: macos-latest
            lua-version: "5.4.9"
            verification: full
          - os: ubuntu-latest
            lua-version: "5.5.1"
            verification: runtime
          - os: macos-latest
            lua-version: "5.5.1"
            verification: runtime
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "${{ matrix.lua-version }}"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
        with:
          luaRocksVersion: "3.13.0"

      - name: Configure native libraries on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zstd
          openssl_dir="$(brew --prefix openssl@3)"
          zstd_dir="$(brew --prefix zstd)"
          echo "OPENSSL_DIR=$openssl_dir" >> "$GITHUB_ENV"
          echo "CRYPTO_DIR=$openssl_dir" >> "$GITHUB_ENV"
          echo "ZSTD_DIR=$zstd_dir" >> "$GITHUB_ENV"

      - name: Install Zstandard development library on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Install development dependencies
        run: |
          if test -n "${OPENSSL_DIR:-}"; then
            luarocks install --only-deps mongodb-0.10.6-1.rockspec OPENSSL_DIR="$OPENSSL_DIR" CRYPTO_DIR="$CRYPTO_DIR"
          else
            luarocks install --only-deps mongodb-0.10.6-1.rockspec
          fi
          luarocks install busted 2.3.0-1
          luarocks install lua-csnappy 0.1.5-2
          if test -n "${ZSTD_DIR:-}"; then
            luarocks install lua-zstd 0.2.0-1 ZSTD_DIR="$ZSTD_DIR"
          else
            luarocks install lua-zstd 0.2.0-1
          fi

      - name: Install Lua 5.4 lint tools
        if: matrix.verification == 'full'
        run: |
          luarocks install luacheck 1.2.0-1

      - name: Run required fast verification
        if: matrix.verification == 'full'
        run: make check-fast

      - name: Run Lua 5.5 runtime verification
        if: matrix.verification == 'runtime'
        run: make check-fast-runtime

      - name: Verify executable roadmap and commit evidence
        run: python3 planning/update_plan.py check --strict

  compatibility-smoke:
    strategy:
      fail-fast: false
      matrix:
        entry: [mongodb-7.0-standalone, mongodb-8.0-sharded, mongodb-8.2-replicaset]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.9
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.4.9"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
        with:
          luaRocksVersion: "3.13.0"

      - name: Install driver dependencies
        run: luarocks install --only-deps mongodb-0.10.6-1.rockspec

      - name: Run live compatibility boundary row
        run: make test-compatibility-live COMPATIBILITY_ENTRY=${{ matrix.entry }}

      - name: Upload machine-readable environment facts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-smoke-${{ matrix.entry }}
          path: build/compatibility/*.json
          if-no-files-found: warn

  gssapi-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.9
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.4.9"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
        with:
          luaRocksVersion: "3.13.0"

      - name: Install Kerberos and driver dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            krb5-admin-server \
            krb5-kdc \
            libsasl2-modules-gssapi-mit
          luarocks install --only-deps mongodb-0.10.6-1.rockspec
          luarocks install busted 2.3.0-1
          luarocks install luacheck 1.2.0-1

      - name: Install the current driver rock
        run: |
          package_tree="$RUNNER_TEMP/lua-mongodb-gssapi-rock"
          luarocks --lua-version=5.4 --tree="$package_tree" make \
            mongodb-0.10.6-1.rockspec --deps-mode=none
          echo "MONGODB_GSSAPI_PACKAGE_TREE=$package_tree" >> "$GITHUB_ENV"

      - name: Download MongoDB Enterprise 8.0.16
        run: |
          archive="$RUNNER_TEMP/mongodb-enterprise.tgz"
          install_dir="$RUNNER_TEMP/mongodb-enterprise"
          curl -fsSL \
            https://downloads.mongodb.com/linux/mongodb-linux-x86_64-enterprise-ubuntu2404-8.0.16.tgz \
            -o "$archive"
          echo "db8c43d482e3f09bd08458e87b15e22d9323f493bd0da0008b863611281b4f2a  $archive" \
            | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          "$install_dir/bin/mongod" --version | grep -Eq '"(enterprise|subscription)"'
          echo "MONGODB_GSSAPI_MONGOD=$install_dir/bin/mongod" >> "$GITHUB_ENV"

      - name: Register Kerberos service DNS facts
        run: >-
          echo '127.0.0.2 gssapi.test gssapi-alias.test'
          | sudo tee -a /etc/hosts >/dev/null

      - name: Run live GSSAPI authentication
        run: bash spec/integration/run_gssapi_live.sh

  examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.9
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.4.9"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
        with:
          luaRocksVersion: "3.13.0"

      - name: Install example verification tools
        run: luarocks install luacheck 1.2.0-1

      - name: Run installed-rock examples
        env:
          MONGODB_EXAMPLES_LIVE: "1"
        run: >-
          make test-focus
          FOCUS_PYTHON=spec.examples.test_examples
          FOCUS_LINT='examples/00-connect-and-ping/main.lua
          examples/01-luarocks-package-explorer/*.lua
          examples/02-game-leaderboard-backend/*.lua
          examples/03-pong-game-using-changestreams/*.lua
          examples/03-pong-game-using-changestreams/client/*.lua'
