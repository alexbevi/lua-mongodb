name: LuaRocks Release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact commit SHA containing the prepared release
        required: true
        type: string
      publish:
        description: Publish the release after validation
        required: false
        default: false
        type: boolean
      confirm_version:
        description: Enter the full rockspec version (for example, 0.5.0-1)
        required: true
        type: string

concurrency:
  group: luarocks-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  credential:
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}

    steps:
      - name: Validate LuaRocks publishing credential without repository code
        run: |
          test -n "$LUAROCKS_API_KEY"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $LUAROCKS_API_KEY" \
            https://luarocks.org/api/1/bearer/status \
            > /dev/null

  validate:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
      rockspec_version: ${{ steps.release.outputs.rockspec_version }}
      tag: ${{ steps.release.outputs.tag }}
      rockspec: ${{ steps.release.outputs.rockspec }}
      source_rock: ${{ steps.release.outputs.source_rock }}
      release_sha: ${{ steps.commit.outputs.release_sha }}

    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve an immutable release commit reachable from main
        id: commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          release_sha="$(git rev-parse "$RELEASE_COMMIT^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check out selected release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.commit.outputs.release_sha }}
          path: release-source
          fetch-depth: 0
          submodules: recursive

      - name: Read and validate release metadata
        id: release
        env:
          RELEASE_ROCKSPEC: release-source/mongodb-${{ inputs.confirm_version }}.rockspec
        run: >-
          python3 spec/release/publish.py metadata
          --rockspec "$RELEASE_ROCKSPEC"
          --github-output "$GITHUB_OUTPUT"

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install package test dependencies
        working-directory: release-source
        run: luarocks install --only-deps "${{ steps.release.outputs.rockspec }}"

      - name: Validate release package without publishing
        working-directory: release-source
        run: make rockspec test-package test-release-checklist

  publish:
    if: inputs.publish
    needs: [credential, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: ${{ needs.validate.outputs.package }}
      VERSION: ${{ needs.validate.outputs.version }}
      ROCKSPEC_VERSION: ${{ needs.validate.outputs.rockspec_version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      ROCKSPEC: ${{ needs.validate.outputs.rockspec }}
      SOURCE_ROCK: ${{ needs.validate.outputs.source_rock }}
      RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
      CONFIRM_VERSION: ${{ inputs.confirm_version }}

    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out validated release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: release-source
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Require explicit version confirmation
        run: |
          test "$CONFIRM_VERSION" = "$ROCKSPEC_VERSION"

      - name: Require complete conformance for this commit
        run: |
          gh run list \
            --workflow full-conformance.yml \
            --commit "$RELEASE_SHA" \
            --limit 20 \
            --json databaseId \
            --jq '.[].databaseId' > run-ids.txt
          : > conformance-runs.jsonl
          while IFS= read -r run_id; do
            gh run view "$run_id" \
              --json conclusion,headSha,jobs >> conformance-runs.jsonl
          done < run-ids.txt
          jq -s . conformance-runs.jsonl > conformance-runs.json
          python3 spec/release/publish.py check-conformance \
            --sha "$RELEASE_SHA" \
            --runs conformance-runs.json

      - name: Create or verify immutable release tag
        run: |
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" \
              -m "$PACKAGE $VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Build source rock from public immutable tag
        working-directory: release-source
        run: luarocks pack "$ROCKSPEC"

      - name: Verify source rock in an isolated tree
        working-directory: release-source
        run: |
          install_tree="$(mktemp -d)"
          run_directory="$(mktemp -d)"
          luarocks --lua-version=5.4 --tree="$install_tree" \
            install "$SOURCE_ROCK" --deps-mode=one
          eval "$(luarocks --lua-version=5.4 --tree="$install_tree" path)"
          (
            cd "$run_directory"
            MONGODB_PACKAGE_TREE="$install_tree" \
              lua "$GITHUB_WORKSPACE/release-source/spec/package/smoke.lua"
          )

      - name: Upload immutable LuaRocks artifacts if absent
        working-directory: release-source
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          state="$(curl --fail --silent --show-error \
            --get \
            --header "Authorization: Bearer $LUAROCKS_API_KEY" \
            --data-urlencode "package=$PACKAGE" \
            --data-urlencode "version=$ROCKSPEC_VERSION" \
            https://luarocks.org/api/1/bearer/check_rockspec)"
          if test "$(jq -r '.version != null' <<< "$state")" = "true"; then
            mkdir published-rockspec
            (
              cd published-rockspec
              luarocks download --rockspec "$PACKAGE" "$ROCKSPEC_VERSION"
            )
            cmp "$ROCKSPEC" "published-rockspec/$ROCKSPEC"
          else
            luarocks upload "$ROCKSPEC" "$SOURCE_ROCK" \
              --temp-key="$LUAROCKS_API_KEY"
          fi

      - name: Verify installation from LuaRocks
        working-directory: release-source
        run: |
          public_tree="$(mktemp -d)"
          for attempt in $(seq 1 12); do
            if luarocks --lua-version=5.4 --tree="$public_tree" \
              install mongodb "$ROCKSPEC_VERSION"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 10
          done
          eval "$(luarocks --lua-version=5.4 --tree="$public_tree" path)"
          MONGODB_PACKAGE_TREE="$public_tree" \
            lua "$GITHUB_WORKSPACE/release-source/spec/package/smoke.lua"

      - name: Create GitHub release if absent
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" \
              = "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              "release-source/$ROCKSPEC" \
              "release-source/$SOURCE_ROCK" \
              --verify-tag \
              --title "$PACKAGE $VERSION" \
              --generate-notes
          fi
