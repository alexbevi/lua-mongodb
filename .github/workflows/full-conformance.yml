name: Full Conformance

on:
  workflow_dispatch:
    inputs:
      run_macos:
        description: Run the complete macOS conformance gate
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 4 * * 1-6"
    - cron: "0 4 * * 0"

concurrency:
  group: full-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FULL_CONFORMANCE_MONGODB_VERSION: "8.2.0"
  FULL_CONFORMANCE_LEGACY_MONGODB_VERSION: "8.0.16"

jobs:
  linux-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install development dependencies
        run: |
          luarocks install --only-deps mongodb-0.5.0-1.rockspec
          luarocks install busted 2.3.0-1
          luarocks install luacheck 1.2.0-1
          luarocks install luacov 0.17.0-1

      - name: Run full static, portable, and coverage checks
        run: make check-fast test-coverage

      - name: Verify executable roadmap and commit evidence
        run: python3 planning/update_plan.py check --strict

      - name: Upload Linux quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-quality-linux-${{ github.sha }}
          path: build/quality/luacov.report.out
          if-no-files-found: warn

  linux-unified:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install driver dependencies
        run: luarocks install --only-deps mongodb-0.5.0-1.rockspec

      - name: Install MongoDB test tools on Linux
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongodb_dir="$RUNNER_TEMP/full-conformance-mongodb"
          mkdir -p "$mongodb_dir"
          curl -fsSL "https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-${FULL_CONFORMANCE_MONGODB_VERSION}.tgz" \
            | tar -xz --strip-components=1 -C "$mongodb_dir"
          echo "$mongodb_dir/bin" >> "$GITHUB_PATH"
          "$mongodb_dir/bin/mongod" --version
          "$mongodb_dir/bin/mongos" --version

      - name: Run deterministic unified shard
        run: >-
          python3 spec/unified/run.py
          --shard-count 4
          --shard-index ${{ matrix.shard }}
          --report build/conformance/unified-shard-${{ matrix.shard }}.json

      - name: Upload unified shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-shard-${{ matrix.shard }}-${{ github.sha }}
          path: build/conformance/unified-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  linux-version-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install driver dependencies
        run: luarocks install --only-deps mongodb-0.5.0-1.rockspec

      - name: Install pre-8.2 MongoDB test tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongodb_dir="$RUNNER_TEMP/full-conformance-mongodb-pre-8.2"
          mkdir -p "$mongodb_dir"
          curl -fsSL "https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-${FULL_CONFORMANCE_LEGACY_MONGODB_VERSION}.tgz" \
            | tar -xz --strip-components=1 -C "$mongodb_dir"
          echo "$mongodb_dir/bin" >> "$GITHUB_PATH"
          "$mongodb_dir/bin/mongod" --version

      - name: Run exact supplemental version branches
        run: >-
          python3 spec/unified/run.py
          --include index-management/tests/index-rawdata.json
          --include 'change-streams/tests/unified/change-streams-disambiguatedPaths.json::test?1?'
          --report build/conformance/unified-pre-8.2.json

      - name: Upload pre-8.2 exact evidence
        uses: actions/upload-artifact@v7
        with:
          name: unified-pre-8.2-${{ github.sha }}
          path: build/conformance/unified-pre-8.2.json
          if-no-files-found: error

  linux-aggregate:
    needs: [linux-unified, linux-version-branches]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download unified shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: unified-shard-*-${{ github.sha }}
          path: build/conformance/shards
          merge-multiple: true

      - name: Download pre-8.2 exact evidence
        uses: actions/download-artifact@v8
        with:
          name: unified-pre-8.2-${{ github.sha }}
          path: build/conformance/version-branches

      - name: Aggregate exact unified evidence and global ratchets
        run: >-
          python3 spec/unified/run.py
          --aggregate build/conformance/shards/*.json
          --report build/conformance/unified.json

      - name: Validate exact v0.4 conformance evidence
        run: >-
          python3 spec/v04/scope.py
          --check
          --execution-report build/conformance/unified.json
          --execution-report build/conformance/version-branches/unified-pre-8.2.json

      - name: Validate exact v0.5 conformance evidence
        run: >-
          python3 spec/v05/scope.py
          --check
          --execution-report build/conformance/unified.json
          --execution-report build/conformance/version-branches/unified-pre-8.2.json

      - name: Upload authoritative Linux conformance evidence
        uses: actions/upload-artifact@v7
        with:
          name: full-conformance-linux-${{ github.sha }}
          path: |
            build/conformance/unified.json
            build/conformance/version-branches/unified-pre-8.2.json
          if-no-files-found: error

  macos:
    if: >-
      github.event.schedule == '0 4 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_macos)
    runs-on: macos-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Configure OpenSSL on macOS
        run: |
          brew install openssl@3
          openssl_dir="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=$openssl_dir" >> "$GITHUB_ENV"
          echo "CRYPTO_DIR=$openssl_dir" >> "$GITHUB_ENV"

      - name: Install development dependencies
        run: |
          luarocks install --only-deps mongodb-0.5.0-1.rockspec OPENSSL_DIR="$OPENSSL_DIR" CRYPTO_DIR="$CRYPTO_DIR"
          luarocks install busted 2.3.0-1
          luarocks install luacheck 1.2.0-1
          luarocks install luacov 0.17.0-1

      - name: Install MongoDB test tools on macOS
        run: |
          brew install mongosh
          case "$(uname -m)" in
            arm64) mongodb_arch=arm64 ;;
            x86_64) mongodb_arch=x86_64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 2 ;;
          esac
          mongodb_dir="$RUNNER_TEMP/full-conformance-mongodb"
          mkdir -p "$mongodb_dir"
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-macos-${mongodb_arch}-${FULL_CONFORMANCE_MONGODB_VERSION}.tgz" \
            | tar -xz --strip-components=1 -C "$mongodb_dir"
          echo "$mongodb_dir/bin" >> "$GITHUB_PATH"
          "$mongodb_dir/bin/mongod" --version
          "$mongodb_dir/bin/mongos" --version

      - name: Run exact supplemental version branches
        run: |
          case "$(uname -m)" in
            arm64) mongodb_arch=arm64 ;;
            x86_64) mongodb_arch=x86_64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 2 ;;
          esac
          legacy_mongodb_dir="$RUNNER_TEMP/full-conformance-mongodb-pre-8.2"
          mkdir -p "$legacy_mongodb_dir"
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-macos-${mongodb_arch}-${FULL_CONFORMANCE_LEGACY_MONGODB_VERSION}.tgz" \
            | tar -xz --strip-components=1 -C "$legacy_mongodb_dir"
          PATH="$legacy_mongodb_dir/bin:$PATH" python3 spec/unified/run.py \
            --include index-management/tests/index-rawdata.json \
            --include 'change-streams/tests/unified/change-streams-disambiguatedPaths.json::test?1?' \
            --report build/conformance/unified-pre-8.2.json

      - name: Run authoritative full portable and loopback checks
        run: >-
          make check-full
          UNIFIED_REPORT=build/conformance/unified.json
          V04_SUPPLEMENTAL_REPORT=build/conformance/unified-pre-8.2.json

      - name: Verify executable roadmap and commit evidence
        run: python3 planning/update_plan.py check --strict

      - name: Upload full macOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-conformance-macos-${{ github.sha }}
          path: |
            build/conformance/unified.json
            build/conformance/unified-pre-8.2.json
            build/quality/luacov.report.out
          if-no-files-found: warn

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        series: ["7.0", "8.0", "8.2"]
        topology: [standalone, replicaset, sharded]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned references
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Lua 5.4.8
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Install driver dependencies
        run: luarocks install --only-deps mongodb-0.5.0-1.rockspec

      - name: Run pinned live compatibility row
        run: >-
          make test-compatibility-live
          COMPATIBILITY_ENTRY=mongodb-${{ matrix.series }}-${{ matrix.topology }}

      - name: Upload machine-readable environment facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-${{ matrix.series }}-${{ matrix.topology }}-${{ github.sha }}
          path: build/compatibility/*.json
          if-no-files-found: warn
